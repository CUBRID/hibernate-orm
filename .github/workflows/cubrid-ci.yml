name: CUBRID CI

# Hibernate's own CI does not run community dialects, so this fork runs the
# full suite against every CUBRID version we support.
#
# The scheduled run tests `ref` with main merged into it, which is how we notice
# an upstream change that breaks CUBRID before it reaches a release. Until the
# dialect work is merged upstream, `ref` is the branch that carries it; once it
# is merged, point `ref` at main and drop the merge step.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test'
        required: false
        default: 'cubrid-daily'
      gradle-args:
        description: 'Gradle tasks and filters to run against CUBRID'
        required: false
        default: 'ciCheck'
  schedule:
    # 30 minutes after "Sync upstream" has merged hibernate/main into our main
    - cron: '30 18 * * *'

permissions: {}

jobs:
  test:
    name: CUBRID ${{ matrix.cubrid-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cubrid-version: [ "10.2", "11.0", "11.2", "11.3", "11.4" ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `inputs` is empty on a scheduled run, so repeat the dispatch default
          ref: ${{ inputs.ref || 'cubrid-daily' }}
          # full history, otherwise the merge below has no common ancestor
          fetch-depth: 0
          persist-credentials: false
      - name: Merge main
        # Fails on conflict, which is the signal that an upstream change collides
        # with ours. Nothing is pushed: the merge only exists for this run.
        run: |
          git fetch --no-tags origin main
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              merge --no-edit FETCH_HEAD
      - name: Reclaim disk space
        run: .github/ci-prerequisites.sh
      - name: Start CUBRID ${{ matrix.cubrid-version }}
        run: CUBRID_IMAGE=docker.io/cubrid/cubrid:${{ matrix.cubrid-version }} ./db.sh cubrid
      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Run tests
        run: |
          read -ra gradle_args <<< "$GRADLE_ARGS"
          ./gradlew "${gradle_args[@]}" -Pdb=cubrid -Plog-test-progress=true --stacktrace
        shell: bash
        env:
          GRADLE_ARGS: ${{ inputs.gradle-args || 'ciCheck' }}
          MAVEN_MIRROR: "https://maven-central.storage-download.googleapis.com/maven2/"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.cubrid-version }}
          path: '**/target/test-results/**/*.xml'
          if-no-files-found: warn
