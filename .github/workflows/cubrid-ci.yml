name: CUBRID CI

# Hibernate's own CI does not run community dialects, so this fork runs the
# full suite against every CUBRID version we support.
#
# The scheduled run tests main, which "Sync upstream" keeps level with
# hibernate/main, so an upstream change that breaks CUBRID shows up here before
# it reaches a release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test'
        required: false
        default: 'main'
      gradle-args:
        description: 'Gradle tasks and filters to run against CUBRID'
        required: false
        default: 'ciCheck'
      create-issue:
        description: 'Post the report as an issue (scheduled runs always do)'
        required: false
        default: false
        type: boolean
  schedule:
    # 30 minutes after "Sync upstream" has merged hibernate/main into our main
    - cron: '30 18 * * *'

permissions: {}

jobs:
  test:
    name: CUBRID ${{ matrix.cubrid-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cubrid-version: "10.2", image: "docker.io/cubrid/cubrid:10.2" }
          - { cubrid-version: "11.0", image: "docker.io/cubrid/cubrid:11.0" }
          - { cubrid-version: "11.2", image: "docker.io/cubrid/cubrid:11.2" }
          - { cubrid-version: "11.3", image: "docker.io/cubrid/cubrid:11.3" }
          - { cubrid-version: "11.4", image: "docker.io/cubrid/cubrid:11.4" }
          # The development build, tested with the driver shipped inside it rather than
          # the released one, so an engine or driver regression surfaces before release.
          - { cubrid-version: "Nightly", image: "ghcr.io/srltas/cubrid-nightly:latest", bundled-driver: true }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `inputs` is empty on a scheduled run, so repeat the dispatch default
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - name: Reclaim disk space
        run: .github/ci-prerequisites.sh
      - name: Start CUBRID ${{ matrix.cubrid-version }}
        run: CUBRID_IMAGE=${{ matrix.image }} ./db.sh cubrid
      - name: Take the JDBC driver from the image
        if: matrix.bundled-driver
        # `cubrid_jdbc.jar` is a stable symlink whose target carries the driver version,
        # and that target is already named the way a flatDir repository expects. The
        # released driver is a different version, so without the catalog edit the build
        # would resolve that one from Maven Central instead of the one extracted here.
        run: |
          set -euo pipefail
          jar=$(docker exec cubrid sh -lc 'readlink -f "$CUBRID"/jdbc/cubrid_jdbc.jar')
          version=${jar##*/cubrid-jdbc-}
          version=${version%.jar}
          mkdir -p "$RUNNER_TEMP/cubrid-jdbc"
          docker cp "cubrid:$jar" "$RUNNER_TEMP/cubrid-jdbc/cubrid-jdbc-$version.jar"
          sed -i "s/^cubrid = .*/cubrid = \"$version\"/" gradle/libs.versions.toml
          echo "ADDITIONAL_REPO=$RUNNER_TEMP/cubrid-jdbc" >> "$GITHUB_ENV"
          echo "driver $version"
      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Run tests
        run: |
          read -ra gradle_args <<< "$GRADLE_ARGS"
          # hibernate-core always has known CUBRID failures, so keep going to run the other modules too
          ./gradlew "${gradle_args[@]}" -Pdb=cubrid -Plog-test-progress=true --stacktrace --continue
        shell: bash
        env:
          GRADLE_ARGS: ${{ inputs.gradle-args || 'ciCheck' }}
          MAVEN_MIRROR: "https://maven-central.storage-download.googleapis.com/maven2/"
          # CUBRID runs the whole suite in one test JVM, which outgrows the default 512m metaspace
          ORG_GRADLE_PROJECT_toolchain.launcher.jvmargs: "-Dlog4j2.disableJmx=true -Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Duser.timezone=UTC -Dfile.encoding=UTF-8"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.cubrid-version }}
          path: '**/target/test-results/**/*.xml'
          if-no-files-found: warn
      - name: Record the environment
        id: environment
        if: always()
        shell: bash
        run: |
          set +eo pipefail
          engine=$(docker exec cubrid sh -lc cubrid_rel 2>/dev/null | sed -n 's/^CUBRID [^(]*(\([^)]*\)).*/\1/p' | head -n 1)
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null)
          driver=$(sed -n 's/^cubrid = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          jdk=$(java -version 2>&1 | head -n 1)
          {
            echo "engine=${engine:-unknown}"
            echo "digest=${digest#*@}"
            echo "driver=${driver:-unknown}"
            echo "jdk=${jdk:-unknown}"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
      - name: Summarize the results
        if: always()
        run: >
          python3 .github/cubrid-ci/collect.py --version "$VERSION" --root . --out "cubrid-results-$VERSION.json"
          --run-id "$GITHUB_RUN_ID" --image "$IMAGE" --engine "$ENGINE" --digest "$DIGEST" --driver "$DRIVER"
          --driver-source "$DRIVER_SOURCE" --runner "$ImageOS $ImageVersion" --jdk "$JDK" --commit "$COMMIT"
        env:
          VERSION: ${{ matrix.cubrid-version }}
          IMAGE: ${{ matrix.image }}
          ENGINE: ${{ steps.environment.outputs.engine }}
          DIGEST: ${{ steps.environment.outputs.digest }}
          DRIVER: ${{ steps.environment.outputs.driver }}
          DRIVER_SOURCE: ${{ matrix.bundled-driver && 'image' || 'maven' }}
          JDK: ${{ steps.environment.outputs.jdk }}
          COMMIT: ${{ steps.environment.outputs.commit }}
      - name: Upload the results summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubrid-results-${{ matrix.cubrid-version }}
          path: cubrid-results-${{ matrix.cubrid-version }}.json
          retention-days: 30

  report:
    name: Report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
          sparse-checkout: .github/cubrid-ci
      - name: Download the results of this run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          pattern: cubrid-results-*
          path: results
          merge-multiple: true
      - name: Find the previous scheduled run
        run: .github/cubrid-ci/baseline.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_DIR: results
      - name: Write the report
        run: |
          python3 .github/cubrid-ci/report.py --results-dir results --out-dir out \
            --baseline baseline/cubrid-report-state.json --compare compare.json \
            --expect "$EXPECT" --date "$(TZ=Asia/Seoul date +%F)" \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --repo-url "$REPO_URL"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          # keep in step with the versions of the test matrix
          EXPECT: "10.2,11.0,11.2,11.3,11.4,Nightly"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Keep the state for the next run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cubrid-report-state
          path: out/cubrid-report-state.json
          retention-days: 90
      - name: Post the daily issue
        if: github.event_name == 'schedule' || inputs.create-issue
        run: |
          gh label create ci-report --description "Daily CUBRID CI report" --color 0E8A16 --force
          url=$(gh issue create --title "$(cat out/title.txt)" --body-file out/issue.md --label ci-report)
          echo "$url"
          if [ "$(cat out/keep-open.txt)" != "true" ]; then
            gh issue close "$url" --reason completed
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Fail when results are missing
        run: |
          if [ "$(cat out/incomplete.txt)" = "true" ]; then
            echo "::error::Some CUBRID versions produced no results or lost a module, see the report"
            exit 1
          fi
